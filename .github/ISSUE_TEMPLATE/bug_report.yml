name: Bug report
description: Report a reproducible problem with ClickCue.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not attach private profiles, credentials, or unsanitized screenshots/logs.
        Report security vulnerabilities privately through the Security tab.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and ClickCue version or commit.
      placeholder: macOS 15, Python 3.14, commit abc1234
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a harmless test window and synthetic step names.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant errors after removing private information.
    validations:
      required: true
