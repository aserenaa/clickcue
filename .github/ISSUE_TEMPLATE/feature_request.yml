name: Feature request
description: Suggest an improvement to a desktop workflow.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow and what gets in the way. Use synthetic examples.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would help?
      description: Describe the behavior you would like and any alternatives you tried.
    validations:
      required: true
