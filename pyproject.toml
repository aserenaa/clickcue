[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clickcue"
version = "0.1.0"
description = "Coordinate-based click automation with named steps, delays, and reusable profiles"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Abraham Serena" }]
keywords = ["auto-clicker", "automation", "macos", "mouse", "macro"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]
dependencies = ["pynput>=1.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15", "build>=1.2", "twine>=6", "pip-audit>=2.9"]

[project.urls]
Repository = "https://github.com/aserenaa/clickcue"
Issues = "https://github.com/aserenaa/clickcue/issues"

[project.scripts]
clickcue = "clickcue.gui:main"

[tool.setuptools.packages.find]
include = ["clickcue*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]
